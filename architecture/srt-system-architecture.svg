<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#53718b"/></marker><style>text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:34px;font-weight:bold}.sub{font-size:17px;fill:#526577}.node{fill:#eaf3fb;stroke:#32678e;stroke-width:3}.oval{fill:#f5f8fa;stroke:#718a9c;stroke-width:2}.sig{font-size:14px;fill:#526577}.nt{font-size:20px;font-weight:bold}.nb{font-size:15px}.ot{font-size:16px;font-weight:bold}.ob{font-size:14px}.link{stroke:#66849a;stroke-width:2.4;fill:none;marker-end:url(#a)}.can{stroke:#d28a31;stroke-width:5;fill:none}.label{font-size:15px;font-weight:bold;fill:#a36511}</style></defs><rect width="1800" height="1280" fill="white"/><text x="50" y="55" class="title">SRT Vehicle System Architecture</text><text x="50" y="83" class="sub">ESP32 nodes centered; connected hardware and services in ovals · CAN 500 kbps unless noted</text>
<!-- CAN trunk -->
<path d="M310 590H1490" class="can"/><text x="780" y="575" class="label">SHARED CANH / CANL · 500 kbps · MCP2515 8 MHz · 120 Ω at physical ends</text>
<!-- Nodes -->
<rect x="650" y="180" width="500" height="210" rx="24" class="node"/><text x="680" y="215" class="nt">NODE 5 · DASHBOARD</text><text x="680" y="246" class="nb">ESP32 + MCP2515 (SPI 18/19/23, CS25, INT27)</text><text x="680" y="273" class="nb">Wi‑Fi AP · HTTP server · LittleFS UI · CAN logger</text><text x="680" y="300" class="nb">Receives telemetry; sends joystick/drive/steering control</text><text x="680" y="332" class="nb">TX 0x110, 0x120, 0x123 · RX telemetry + 0x111/121/122/124</text><text x="680" y="361" class="nb">Heartbeat 0x600 · dashboard at 192.168.4.1</text>
<rect x="130" y="670" width="450" height="205" rx="24" class="node"/><text x="160" y="706" class="nt">NODE 1 · BCM</text><text x="160" y="738" class="nb">ESP32 + MCP2515 · accelerator ADC GPIO34</text><text x="160" y="765" class="nb">Steering motor PWM GPIO32 / GPIO33</text><text x="160" y="797" class="nb">TX 0x100 angle, 0x301 pedal ADC · RX 0x110 command</text><text x="160" y="826" class="nb">TX 0x111 applied steering status</text>
<rect x="675" y="730" width="450" height="205" rx="24" class="node"/><text x="705" y="766" class="nt">NODE 2 · PCM</text><text x="705" y="798" class="nb">ESP32 + MCP2515 · traction and reverse controller</text><text x="705" y="825" class="nb">Motor PWM GPIO13/14 · active‑LOW relays GPIO33/26</text><text x="705" y="857" class="nb">RX 0x123 traction, 0x120 gate, 0x300 switches</text><text x="705" y="886" class="nb">TX 0x201 output, 0x124 gate feedback, 0x600 heartbeat</text>
<rect x="1220" y="670" width="450" height="205" rx="24" class="node"/><text x="1250" y="706" class="nt">NODE 3 · CCM</text><text x="1250" y="738" class="nb">ESP32 + MCP2515 · six active‑LOW switches to GND</text><text x="1250" y="765" class="nb">GPIO4 cruise · 5 HillHold · 13 autonomous</text><text x="1250" y="792" class="nb">GPIO14 remote · 26 horn · 33 reverse</text><text x="1250" y="824" class="nb">TX 0x300 switch mask · TX 0x122 feedback</text><text x="1250" y="851" class="nb">RX 0x120 ownership gate</text>
<rect x="675" y="1010" width="450" height="190" rx="24" class="node"/><text x="705" y="1046" class="nt">NODE 4 · TCU</text><text x="705" y="1078" class="nb">ESP32 + MCP2515 · GPS UART GPIO16 @ 9600</text><text x="705" y="1105" class="nb">Ignition GPIO34 · MPU6050 I²C GPIO21/22</text><text x="705" y="1137" class="nb">TX 0x400 GPS, 0x401 ignition, 0x500 pitch</text><text x="705" y="1166" class="nb">RX 0x300 switches · TX 0x600 heartbeat</text>
<!-- nodes to CAN -->
<path d="M300 670V590M900 390V590M900 730V590M1450 670V590M900 1010V935" class="link"/>
<!-- external oval components -->
<ellipse cx="250" cy="170" rx="175" ry="70" class="oval"/><text x="250" y="163" text-anchor="middle" class="ot">Browser / operator</text><text x="250" y="188" text-anchor="middle" class="ob">Wi‑Fi HTTP controls + telemetry</text><path d="M425 180L650 250" class="link"/><text x="475" y="197" class="sig">Wi‑Fi · POST /api/joystick, /drive, /steering</text>
<ellipse cx="1450" cy="170" rx="205" ry="70" class="oval"/><text x="1450" y="163" text-anchor="middle" class="ot">Steering wheel / IMU sender</text><text x="1450" y="188" text-anchor="middle" class="ob">ESP‑NOW angle + sequence → Node 1</text><path d="M1370 230L550 700" class="link"/><text x="1120" y="410" class="sig">ESP‑NOW wireless steering feedback</text>
<ellipse cx="140" cy="1030" rx="125" ry="60" class="oval"/><text x="140" y="1025" text-anchor="middle" class="ot">Accelerator pedal</text><text x="140" y="1048" text-anchor="middle" class="ob">1.1–4.52 V*</text><path d="M220 970L240 875" class="link"/><text x="70" y="1140" class="sig">*10k/15k divider to GPIO34</text>
<ellipse cx="450" cy="1110" rx="145" ry="58" class="oval"/><text x="450" y="1105" text-anchor="middle" class="ot">Steering motor driver</text><text x="450" y="1128" text-anchor="middle" class="ob">LPWM / RPWM · GPIO32/33</text><path d="M420 875L450 1052" class="link"/>
<ellipse cx="1330" cy="1015" rx="150" ry="65" class="oval"/><text x="1330" y="1008" text-anchor="middle" class="ot">Traction motor controller</text><text x="1330" y="1032" text-anchor="middle" class="ob">PWM GPIO13 / GPIO14</text><path d="M1125 835L1225 980" class="link"/>
<ellipse cx="1630" cy="1050" rx="130" ry="62" class="oval"/><text x="1630" y="1044" text-anchor="middle" class="ot">Reverse relays</text><text x="1630" y="1068" text-anchor="middle" class="ob">Active‑LOW GPIO33/26</text><path d="M1125 865L1500 1030" class="link"/>
<ellipse cx="1420" cy="440" rx="170" ry="65" class="oval"/><text x="1420" y="433" text-anchor="middle" class="ot">Six vehicle switches</text><text x="1420" y="457" text-anchor="middle" class="ob">cruise · hill · auto · remote · horn · reverse</text><path d="M1420 505L1430 670" class="link"/>
<ellipse cx="320" cy="440" rx="135" ry="60" class="oval"/><text x="320" y="435" text-anchor="middle" class="ot">GPS receiver</text><text x="320" y="458" text-anchor="middle" class="ob">TX → GPIO16 · 9600 baud</text><path d="M430 480L710 1010" class="link"/>
<ellipse cx="1450" cy="1180" rx="155" ry="55" class="oval"/><text x="1450" y="1175" text-anchor="middle" class="ot">Ignition + MPU6050</text><text x="1450" y="1198" text-anchor="middle" class="ob">GPIO34 · I²C 21/22</text><path d="M1125 1150L1295 1180" class="link"/>
<text x="40" y="1248" class="sig">Message key: 0x100 angle · 0x110 steering cmd · 0x111 steering feedback · 0x120 ownership · 0x121/122 gate feedback · 0x123 traction · 0x124 applied gate · 0x201 powertrain · 0x300 switches · 0x301 pedal · 0x400 GPS · 0x401 ignition · 0x500 pitch · 0x600 heartbeat</text></svg>
